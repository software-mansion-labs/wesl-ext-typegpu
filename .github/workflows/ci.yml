name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Sets up Node.js and pnpm, then installs dependencies with caching.
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: 22
          cache: true

      # Format, lint and typecheck.
      - name: Check
        run: vp check

      - name: Test
        run: vp run test

      - name: Build package
        run: vp run wesl-ext-typegpu#build

      - name: Build example app
        run: vp run example-app#build
